; ASCII only: mypy reads this file in the system codepage (cp1252 here), and
; Cyrillic makes it unreadable -- the same constraint alembic.ini lives under.
; The reasoning behind this configuration is in README.md, "Перевірки".
;
; Short version: three bugs in a row were the same mistake -- a changed
; signature and a missed call site. mypy finds all three in a second.

[mypy]
python_version = 3.13
files = app
ignore_missing_imports = True

; A first pass, not "the code is typed". What is switched off below is noisy,
; not unsafe: mostly aiogram's Message | InaccessibleMessage, which handlers
; already filter with `is not None`. Turning these on deserves its own pass.
disable_error_code = arg-type, union-attr, return-value, assignment, misc, attr-defined
