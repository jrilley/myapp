[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Keep this file ASCII-only: Alembic reads it with the *locale* encoding
# (cp1252 on many Windows systems), so non-ASCII comments break `alembic`.
# The DB URL comes from app.config (backend/.env), see migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
